version: '3.8'

services:
  # 1. LLM 推理引擎（SSD 高速讀取）
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - "F:/ollama:/root/.ollama"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 2. 向量資料庫（D 槽大容量）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "D:/local-ai-agent/qdrant_storage:/qdrant/storage"
    restart: unless-stopped

  # 3. AI 助理前端介面
  open-webui:
    # 以 digest 固定版本：0.10.2（main 分支 build ecd48e2，2026-07-01）。
    # 這顆和官方 v0.10.2 tag 的 digest 不同；要升級時先備份 webui.db，再改這一行。
    image: ghcr.io/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    container_name: open-webui
    ports:
      # 只綁本機，區網其他裝置連不到
      - "127.0.0.1:3000:8080"
    volumes:
      - "D:/local-ai-agent/open-webui:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # 4. 自動化工作流引擎
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - "D:/local-ai-agent/n8n_data:/home/node/.n8n"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Taipei
    restart: unless-stopped

  # 5. 完全私有化 AI 爬蟲（新增：全自動建立環境，不需要本地 venv）
  crawler:
    build: ./crawler
    container_name: crawler
    ports:
      - "5000:5000"
    restart: unless-stopped