version: '3.8'

services:
  # 1. LLM 推理引擎（SSD 高速讀取）
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - "F:/ollama:/root/.ollama"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 2. 向量資料庫（D 槽大容量）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "D:/local-ai-agent/qdrant_storage:/qdrant/storage"
    restart: unless-stopped

  # 3. AI 助理前端介面
  open-webui:
    # 以 digest 固定版本：v0.13.4（官方 tag，2026-11-17）。2026-11-18 由 0.10.2 升級，
    # 升級前備份在 D:/local-ai-agent/_backup/open-webui_20261118_pre0134_stopped。
    # 要升級時先停容器、備份 webui.db 與 uploads、vector_db，再改這一行。
    image: ghcr.io/open-webui/open-webui@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901
    container_name: open-webui
    # 以 tini 當 PID 1，收掉殭屍程序並轉送停止訊號；避免 docker stop 卡住（2026-11-18 遇過）。
    # 未驗證：套用後 docker stop 是否不再卡住，下次停容器時確認。
    init: true
    ports:
      # 只綁本機，區網其他裝置連不到
      - "127.0.0.1:3000:8080"
    volumes:
      - "D:/local-ai-agent/open-webui:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # 沒設 WEBUI_SECRET_KEY 時映像會自動產生金鑰；存進資料夾才不會每次重建容器就讓所有人登出
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
    depends_on:
      - ollama
    restart: unless-stopped

  # 4. 自動化工作流引擎
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - "D:/local-ai-agent/n8n_data:/home/node/.n8n"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Taipei
    restart: unless-stopped

  # 5. 完全私有化 AI 爬蟲（新增：全自動建立環境，不需要本地 venv）
  crawler:
    build: ./crawler
    container_name: crawler
    ports:
      - "5000:5000"
    restart: unless-stopped